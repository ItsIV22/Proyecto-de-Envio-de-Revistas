<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Revistas Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="includes/magazine_3724.ico">
</head>
<body class="cliente-body d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg cliente-navbar mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">Revistas Express</a>
            <div class="d-flex align-items-center ms-auto">
                <span class="me-3 fw-medium text-muted" id="clientName">Hola!</span>
                <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Tarjetas de Métricas del Cliente -->
        <div class="row g-3 mb-4" id="client-stats-container">
            <div class="col-12 col-sm-4">
                <div class="card card-social border-0 p-3 bg-white d-flex flex-row align-items-center">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary me-3 fs-4" style="line-height: 1;">
                        📚
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Mis Solicitudes</h6>
                        <h4 class="fw-bold mb-0" id="stat-solicitudes-total">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-4">
                <div class="card card-social border-0 p-3 bg-white d-flex flex-row align-items-center">
                    <div class="bg-info bg-opacity-10 p-3 rounded-circle text-info me-3 fs-4" style="line-height: 1;">
                        🚚
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">En Camino</h6>
                        <h4 class="fw-bold mb-0" id="stat-solicitudes-transito">0</h4>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-4">
                <div class="card card-social border-0 p-3 bg-white d-flex flex-row align-items-center">
                    <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success me-3 fs-4" style="line-height: 1;">
                        ✅
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 small fw-semibold">Entregados</h6>
                        <h4 class="fw-bold mb-0" id="stat-solicitudes-entregados">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Mis Revistas</h2>
            <button class="btn btn-social text-white shadow-sm" onclick="openSolicitudModal()">
                + Solicitar Revista
            </button>
        </div>

        <!-- Tarjetas de Envíos del Cliente -->
        <div class="row g-4" id="misEnviosContainer">
            <!-- Cargando envios -->
            <div class="text-center text-muted w-100 py-5">Cargando tus solicitudes...</div>
        </div>
    </div>

    <!-- Modal Solicitar -->
    <div class="modal fade" id="solicitarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-social border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Solicitar un Ejemplar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Selecciona la revista que deseas recibir en tu domicilio.</p>
                    <form id="solicitarForm">
                        <div class="mb-4">
                            <label class="form-label fw-medium">Ejemplares Disponibles</label>
                            <select id="solicitud_ejemplar" class="form-select form-select-lg rounded-3 bg-light border-0" required></select>
                        </div>
                        <button type="submit" class="btn btn-social text-white w-100 py-2">Confirmar Solicitud</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer de créditos -->
    <footer class="text-center py-3 text-muted small mt-auto" style="background: var(--social-card); border-top: 1px solid #e5e7eb;">
        <p class="mb-0">© 2026 Revistas Express. Icono Revista por <a href="https://icon-icons.com/es/authors/10-icons8" target="_blank" rel="noopener" class="text-secondary fw-semibold">Icons8 en Icon-Icons.com</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cliente.js"></script>
</body>
</html>
