<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Revistas Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cliente-body">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg cliente-navbar mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">Revistas Express</a>
            <div class="d-flex align-items-center ms-auto">
                <span class="me-3 fw-medium text-muted" id="clientName">Hola!</span>
                <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Mis Revistas</h2>
            <button class="btn btn-social text-white shadow-sm" onclick="openSolicitudModal()">
                + Solicitar Revista
            </button>
        </div>

        <!-- Tarjetas de Envíos del Cliente -->
        <div class="row g-4" id="misEnviosContainer">
            <!-- Cargando envios -->
            <div class="text-center text-muted w-100 py-5">Cargando tus solicitudes...</div>
        </div>
    </div>

    <!-- Modal Solicitar -->
    <div class="modal fade" id="solicitarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-social border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Solicitar un Ejemplar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Selecciona la revista que deseas recibir en tu domicilio.</p>
                    <form id="solicitarForm">
                        <div class="mb-4">
                            <label class="form-label fw-medium">Ejemplares Disponibles</label>
                            <select id="solicitud_ejemplar" class="form-select form-select-lg rounded-3 bg-light border-0" required></select>
                        </div>
                        <button type="submit" class="btn btn-social text-white w-100 py-2">Confirmar Solicitud</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cliente.js"></script>
</body>
</html>
