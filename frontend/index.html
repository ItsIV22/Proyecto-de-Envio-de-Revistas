<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Envíos de Revistas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="includes/magazine_3724.ico">
</head>
<body class="bg-light login-body d-flex flex-column min-vh-100">
    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="card shadow-lg p-4 login-card" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold brand-text">Revistas Express</h3>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>
            
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" required placeholder="Ej: admin o cliente1">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold btn-login">Ingresar</button>
            </form>
            
            <div class="text-center mt-4 text-muted small">
                <p>Credenciales de prueba: <br> admin / admin <br> cliente1 / cliente1</p>
            </div>
        </div>
    </div>

    <!-- Footer de créditos -->
    <footer class="text-center py-3 text-muted small mt-auto" style="background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(5px);">
        <p class="mb-0">Icono Revista por <a href="https://icon-icons.com/es/authors/10-icons8" target="_blank" rel="noopener" class="text-secondary fw-semibold">Icons8 en Icon-Icons.com</a></p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
