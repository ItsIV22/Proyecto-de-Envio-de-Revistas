<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Envíos de Revistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg admin-navbar mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Admin Panel</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="showTab('envios')">Envíos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('revistas')">Revistas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('ejemplares')">Ejemplares</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('personas')">Personas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('agencias')">Agencias</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-light me-3" id="adminName">Cargando...</span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <!-- Tab: Envíos -->
        <div id="tab-envios" class="tab-content active-tab">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 text-primary fw-bold">Gestión de Envíos</h4>
                <button class="btn btn-primary" onclick="openEnvioModal()">+ Nuevo Envío</button>
            </div>
            <div class="card card-corporate">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="card-header-corporate">
                            <tr>
                                <th>ID</th>
                                <th>Revista (Edición)</th>
                                <th>Cliente</th>
                                <th>Agencia</th>
                                <th>Guía</th>
                                <th>Despacho</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="enviosTableBody">
                            <!-- Data here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Las otras pestañas (Revistas, Ejemplares, Personas, Agencias) se omiten el HTML completo para brevedad de prueba, 
             pero el script `admin.js` controlará la visibilidad -->
             
    </div>

    <!-- Modal Envío (Crear / Actualizar) -->
    <div class="modal fade" id="envioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content card-corporate">
                <div class="modal-header card-header-corporate">
                    <h5 class="modal-title" id="envioModalTitle">Nuevo Envío</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="envioForm">
                        <input type="hidden" id="envio_id">
                        <div class="mb-3">
                            <label class="form-label">Ejemplar</label>
                            <select id="envio_ejemplar" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cliente (Persona)</label>
                            <select id="envio_persona" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Agencia de Transporte</label>
                            <select id="envio_agencia" class="form-select"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de Guía</label>
                            <input type="text" id="envio_guia" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha Despacho</label>
                            <input type="date" id="envio_fecha" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select id="envio_estado" class="form-select" required>
                                <option value="Pendiente">Pendiente</option>
                                <option value="En tránsito">En tránsito</option>
                                <option value="Entregado">Entregado</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
